[package]
name = "stellarnotify-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "StellarNotify: on-chain event subscription registry for Soroban"
repository = "https://github.com/Stellarnotify/stellarnotify-contract"
authors = ["StellarNotify Contributors"]
keywords = ["stellar", "soroban", "notifications", "subscriptions", "web3"]
categories = ["cryptography::cryptocurrencies"]

# ── Dependency pinning policy ─────────────────────────────────────────────────
# soroban-sdk is pinned to an exact version (= prefix) rather than a semver
# range. Reasons:
#   1. Soroban SDK minor/patch releases can introduce breaking ABI changes
#      that affect deployed WASM binaries.
#   2. Exact pinning ensures the deployed contract and the version tested in CI
#      are byte-for-byte identical.
#   3. To upgrade: change both [dependencies] and [dev-dependencies] to the
#      new version, run `cargo test --features testutils`, verify all tests
#      pass, then commit.
# ─────────────────────────────────────────────────────────────────────────────

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
# Exact pin — see pinning policy note above.
soroban-sdk = { version = "=22.0.7", features = ["alloc"] }

[dev-dependencies]
# Must match [dependencies] version exactly.
soroban-sdk = { version = "=22.0.7", features = ["testutils", "alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]
