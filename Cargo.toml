[package]
name = "stellarnotify-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "StellarNotify: on-chain event subscription registry for Soroban"
repository = "https://github.com/Stellarnotify/stellarnotify-contract"
authors = ["StellarNotify Contributors"]
keywords = ["stellar", "soroban", "notifications", "subscriptions", "web3"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
soroban-sdk = { version = "=22.0.7", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=22.0.7", features = ["testutils", "alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]
