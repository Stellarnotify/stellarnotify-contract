name: Preview Changelog

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Preview changelog changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate unreleased changelog
        id: changelog
        run: |
          # Generate unreleased changes
          CHANGELOG=$(git cliff --unreleased --strip all)
          
          # Save to output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR with changelog preview
        uses: actions/github-script@v7
        if: steps.changelog.outputs.content != ''
        with:
          script: |
            const changelog = `${{ steps.changelog.outputs.content }}`;
            
            const comment = `## 📋 Changelog Preview
            
            This PR will add the following entries to the changelog:
            
            ${changelog}
            
            ---
            *Generated by git-cliff*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('📋 Changelog Preview')
            );
            
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Check changelog format
        run: |
          echo "✓ Changelog preview generated successfully"
          echo ""
          echo "Unreleased changes:"
          git cliff --unreleased --strip all
