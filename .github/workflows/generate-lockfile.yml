name: Generate Cargo.lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit Cargo.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - name: Generate Cargo.lock and pin rand_core
        run: |
          cargo generate-lockfile
          cargo update rand_core@0.10.1 --precise 0.6.4

      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --staged --quiet || git commit -m "chore: regenerate Cargo.lock with rand_core pinned to 0.6.4"
          git push
