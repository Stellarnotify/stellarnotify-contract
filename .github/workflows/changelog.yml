name: Generate Changelog

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to generate changelog for (leave empty for unreleased)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    name: Generate changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            # Generate for specific tag
            git cliff --tag "${{ github.event.inputs.tag }}" -o CHANGELOG.md
          elif [ "${{ github.event_name }}" = "release" ]; then
            # Generate for new release
            git cliff --tag "${{ github.event.release.tag_name }}" -o CHANGELOG.md
          else
            # Generate unreleased changes
            git cliff --unreleased --prepend CHANGELOG.md
          fi

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code CHANGELOG.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit changelog
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog"
          git push

      - name: Create PR for unreleased changes
        if: steps.git-check.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update changelog with unreleased changes"
          title: "chore: update changelog"
          body: "Automated changelog update generated by git-cliff"
          branch: chore/update-changelog
          delete-branch: true
